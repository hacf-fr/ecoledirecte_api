[project]
name = "ecoledirecte"
version = "0.4.0"
description = "Async Python client to interact with Ecole Directe API."
license = "LGPL-3.0-or-later"
readme = "README.rst"
authors = [{ name = "Giga77" }]
maintainers = [{ name = "Giga77" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Natural Language :: French",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "aiohttp>=3.14.4",
    "backoff>=1.10.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/hacf-fr/ecoledirecte_api"
Repository = "https://github.com/hacf-fr/ecoledirecte_api"
Changelog = "https://github.com/hacf-fr/ecoledirecte_api/releases"
"Bug Tracker" = "https://github.com/hacf-fr/ecoledirecte_api/issues"

[tool.poetry]
packages = [
    { include = "ecoledirecte_api", from = "src" }
]

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.1"
ruff = "^0.15.8"
pytest = "^9.0.3"
pytest-asyncio = "^0.23.0"

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "test_api_version",
    "test_client_behavior",
    "test_client_logging",
    "test_ecoledirecte_api",
]
allow_untyped_defs = true
disable_error_code = "attr-defined, unreachable"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"